<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>you &amp; me — an ongoing story</title>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Handlee&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --plum: #3a1f3d;
  --plum-soft: #5b3760;
  --pink: #ff5c93;
  --pink-glow: #ff85b0;
  --peach: #ffb48a;
  --lavender: #e4d4fb;
  --cream: #fff9fb;
  --ink: #5b4660;
  --gold: #ffd166;
  font-family: 'Handlee', 'Comic Sans MS', cursive;
}
* {
  box-sizing: border-box;
  margin: 0;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  height: 100%;
  overflow-x: hidden;
  scroll-behavior: smooth;
}
body {
  background: #170f2e;
  color: var(--ink);
}

/* ---------- FLOATING CONTROLS ---------- */
.top-controls {
  position: fixed;
  top: calc(14px + env(safe-area-inset-top, 0px));
  right: 16px;
  z-index: 40;
  display: flex;
  gap: 8px;
}
.ctrl-btn {
  appearance: none;
  border: 1.5px solid rgba(255, 255, 255, 0.45);
  background: rgba(58, 31, 61, 0.42);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #fff;
  font-family: 'Sniglet', cursive;
  font-size: 12px;
  letter-spacing: 0.05em;
  padding: 7px 13px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 4px 16px rgba(20, 8, 36, 0.25);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease, border-color 0.3s ease;
}
.ctrl-btn:hover {
  transform: translateY(-2px) scale(1.05);
  background: rgba(255, 92, 147, 0.75);
  border-color: #fff;
}
.ctrl-btn:active {
  transform: scale(0.94);
}
body.open .ctrl-btn {
  background: rgba(255, 255, 255, 0.75);
  color: var(--plum);
  border-color: rgba(255, 92, 147, 0.35);
  box-shadow: 0 6px 20px rgba(91, 70, 96, 0.12);
}
body.open .ctrl-btn:hover {
  background: var(--pink);
  color: #fff;
}
#replayBtn {
  display: none;
}
body.open #replayBtn {
  display: inline-flex;
  animation: popIn 0.6s 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}

/* ---------- PAGE TRANSITION CONTAINERS ---------- */
.page {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  transition: opacity 1.25s cubic-bezier(0.22, 1, 0.36, 1), visibility 1.25s, transform 1.25s cubic-bezier(0.22, 1, 0.36, 1);
}
#p2 {
  opacity: 0;
  visibility: hidden;
  transform: scale(1.04);
  background: linear-gradient(125deg, #ffd6e6 0%, #fff5f8 34%, #ffffff 55%, #e6d6ff 85%, #ffd9ec 100%);
  background-size: 200% 200%;
  animation: bgBreathe 18s ease-in-out infinite;
}
@keyframes bgBreathe {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
body.open #p2 {
  opacity: 1;
  visibility: visible;
  transform: scale(1);
}
body.open #p1 {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: scale(1.08);
}

/* ---------- PAGE 1: SUNSET BEACH & SUSHI ---------- */
#p1 {
  background: linear-gradient(180deg, #120b29 0%, #2b1747 26%, #682d63 52%, #cb597d 76%, #ffb38a 100%);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  perspective: 900px;
}

/* Aurora & Sunbeams on Page 1 */
.sky-aurora {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 65% 35% at 50% 72%, rgba(255, 180, 138, 0.45), transparent 70%),
    radial-gradient(ellipse 50% 25% at 25% 30%, rgba(194, 88, 127, 0.25), transparent 70%),
    radial-gradient(ellipse 55% 25% at 80% 22%, rgba(130, 88, 194, 0.22), transparent 70%);
  animation: auroraPulse 7s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes auroraPulse {
  0% { opacity: 0.75; transform: scale(1); }
  100% { opacity: 1; transform: scale(1.08); }
}

/* Stars & Shooting Stars */
.star {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #fff;
  opacity: 0.25;
  box-shadow: 0 0 6px #fff;
  animation: tw 3.8s ease-in-out infinite;
  pointer-events: none;
}
.star.cross::before,
.star.cross::after {
  content: '';
  position: absolute;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 99px;
}
.star.cross::before {
  width: 11px;
  height: 1.5px;
  left: -4px;
  top: 0.75px;
}
.star.cross::after {
  width: 1.5px;
  height: 11px;
  left: 0.75px;
  top: -4px;
}
@keyframes tw {
  0%, 100% { opacity: 0.2; transform: scale(0.85); }
  50% { opacity: 0.98; transform: scale(1.7); }
}

.shooting-star {
  position: absolute;
  width: 95px;
  height: 2px;
  background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(255,190,220,0.5), transparent);
  border-radius: 999px;
  filter: drop-shadow(0 0 6px #fff);
  opacity: 0;
  pointer-events: none;
  transform: rotate(-28deg);
  animation: shoot 9s ease-in-out infinite;
}
.shooting-star.s2 {
  top: 18%;
  left: 68%;
  animation-delay: 4.2s;
  animation-duration: 11s;
}
.shooting-star.s1 {
  top: 12%;
  left: 28%;
  animation-delay: 1.5s;
}
@keyframes shoot {
  0%, 88%, 100% { opacity: 0; transform: translate(0, 0) rotate(-28deg) scaleX(0.2); }
  90% { opacity: 1; transform: translate(-40px, 22px) rotate(-28deg) scaleX(1); }
  95% { opacity: 0; transform: translate(-220px, 120px) rotate(-28deg) scaleX(0.4); }
}

/* Soft Drifting Clouds */
.cloud {
  position: absolute;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255, 225, 215, 0.22), rgba(212, 110, 152, 0.08));
  filter: blur(2px);
  pointer-events: none;
  animation: driftCloud 36s linear infinite;
}
.cloud.c1 { width: 180px; height: 34px; top: 24%; left: -20%; animation-duration: 42s; }
.cloud.c2 { width: 240px; height: 42px; top: 38%; left: -30%; animation-duration: 54s; animation-delay: -18s; }
.cloud.c3 { width: 150px; height: 28px; top: 16%; left: -15%; animation-duration: 38s; animation-delay: -27s; }
@keyframes driftCloud {
  from { transform: translateX(0); }
  to { transform: translateX(135vw); }
}

/* Moon & Halos */
.moon {
  position: absolute;
  top: 9%;
  right: 12%;
  width: clamp(54px, 9.5vw, 88px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fffdf5 0%, #fff1c9 62%, #ffd79e 100%);
  box-shadow:
    0 0 40px 10px rgba(255, 235, 200, 0.42),
    0 0 90px 28px rgba(255, 175, 200, 0.25);
  animation: moonFloat 6s ease-in-out infinite;
  cursor: pointer;
}
.moon::before,
.moon::after {
  content: '';
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 243, 214, 0.24);
  animation: moonRing 4.5s ease-out infinite;
  pointer-events: none;
}
.moon::after {
  inset: -28px;
  animation-delay: 2.2s;
}
@keyframes moonFloat {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-8px) scale(1.04); }
}
@keyframes moonRing {
  0% { transform: scale(0.85); opacity: 0.7; }
  100% { transform: scale(1.45); opacity: 0; }
}

/* Sea & Multi-layer Waves */
.sea {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 25%;
  background: linear-gradient(180deg, #e0678a 0%, #9b3f77 48%, #471c54 100%);
  overflow: visible;
}
.sea svg {
  position: absolute;
  top: -28px;
  left: 0;
  width: 200%;
  height: 32px;
  animation: wave 13s linear infinite;
}
.sea svg:nth-of-type(2) {
  top: -16px;
  opacity: 0.65;
  animation-duration: 19s;
  animation-direction: reverse;
}
.sea svg:nth-of-type(3) {
  top: -6px;
  opacity: 0.45;
  animation-duration: 9.5s;
}
@keyframes wave {
  to { transform: translateX(-50%); }
}
.sea-shimmer {
  position: absolute;
  inset: 12px 0 0 0;
  overflow: hidden;
  pointer-events: none;
}
.shimmer-bar {
  position: absolute;
  right: 11%;
  height: 3px;
  border-radius: 99px;
  background: rgba(255, 240, 215, 0.55);
  box-shadow: 0 0 10px rgba(255, 230, 190, 0.7);
  animation: shimmerSway 3.2s ease-in-out infinite alternate;
}
@keyframes shimmerSway {
  0% { transform: translateX(-8px) scaleX(0.85); opacity: 0.45; }
  100% { transform: translateX(8px) scaleX(1.18); opacity: 0.9; }
}

/* Hero Palm & Sushi Island */
#hero {
  position: relative;
  width: min(92vw, 570px);
  cursor: pointer;
  animation: bob 4.8s ease-in-out infinite;
  z-index: 2;
  user-select: none;
  -webkit-user-select: none;
  transform-style: preserve-3d;
}
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-15px) rotate(1.3deg); }
}
#hero svg {
  width: 100%;
  height: auto;
  overflow: visible;
  display: block;
  filter:
    drop-shadow(0 0 calc(18px + var(--g, 0) * 6px) rgba(255, 205, 145, 0.8))
    drop-shadow(0 0 calc(40px + var(--g, 0) * 12px) rgba(255, 105, 165, 0.55));
  animation: glow 3.2s ease-in-out infinite;
  transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
}
@keyframes glow {
  50% {
    filter:
      drop-shadow(0 0 calc(32px + var(--g, 0) * 7px) rgba(255, 225, 165, 1))
      drop-shadow(0 0 calc(70px + var(--g, 0) * 14px) rgba(255, 115, 175, 0.85));
  }
}
#hero:hover svg {
  transform: scale(1.035);
}
#hero.pop svg {
  transform: scale(1.14) rotate(-3.2deg);
}

/* SVG internal animations */
.frond {
  transform-origin: 205px 120px;
  animation: sway 3.8s ease-in-out infinite;
}
.frond:nth-child(2n) {
  animation-delay: -1.4s;
  animation-direction: reverse;
}
.frond:nth-child(3n) {
  animation-duration: 4.5s;
}
@keyframes sway {
  0%, 100% { transform: rotate(-2deg); }
  50% { transform: rotate(6.5deg); }
}
.coconut {
  transform-origin: 205px 125px;
  animation: cocoBob 2.6s ease-in-out infinite;
}
@keyframes cocoBob {
  50% { transform: translateY(2.5px) rotate(3deg); }
}
.sushi-group {
  transform-origin: 455px 318px;
  animation: sushiBounce 2.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
}
@keyframes sushiBounce {
  0%, 100% { transform: translate(455px, 318px) scale(1, 1); }
  45% { transform: translate(455px, 310px) scale(0.97, 1.04) rotate(-2deg); }
  55% { transform: translate(455px, 310px) scale(1.03, 0.97) rotate(2deg); }
}
.sushi-eye {
  transform-origin: center;
  animation: blink 4.2s infinite;
}
@keyframes blink {
  0%, 46%, 50%, 96%, 100% { transform: scaleY(1); }
  48%, 98% { transform: scaleY(0.1); }
}
.sushi-heart {
  animation: heartFloatUp 2.6s ease-in-out infinite;
}
.sushi-heart.h2 {
  animation-delay: -1.3s;
}
@keyframes heartFloatUp {
  0% { transform: translateY(0) scale(0.6); opacity: 0; }
  40% { opacity: 0.95; }
  100% { transform: translateY(-28px) translateX(6px) scale(1.15); opacity: 0; }
}
.svg-sparkle {
  transform-box: fill-box;
  transform-origin: center;
  animation: spinSparkle 4s ease-in-out infinite;
}
.svg-sparkle.sp2 { animation-delay: -1.5s; animation-duration: 3.2s; }
.svg-sparkle.sp3 { animation-delay: -2.7s; animation-duration: 4.8s; }
@keyframes spinSparkle {
  0%, 100% { transform: scale(0.6) rotate(0deg); opacity: 0.4; }
  50% { transform: scale(1.25) rotate(90deg); opacity: 1; }
}

/* Tap Hint & Progress Dots */
.hint {
  position: absolute;
  bottom: calc(9.5% + env(safe-area-inset-bottom, 0px));
  left: 0;
  right: 0;
  text-align: center;
  color: #fff4ee;
  font-size: clamp(17px, 4.4vw, 23px);
  z-index: 3;
  text-shadow: 0 2px 14px rgba(50, 8, 55, 0.75);
  pointer-events: none;
}
#hintTxt {
  display: inline-block;
  padding: 6px 18px;
  border-radius: 999px;
  background: rgba(35, 14, 52, 0.35);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border: 1px solid rgba(255, 255, 255, 0.22);
  animation: hintPulse 2.4s ease-in-out infinite;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#hintTxt.bump {
  transform: scale(1.15);
}
@keyframes hintPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 122, 168, 0.4); }
  50% { box-shadow: 0 0 22px 4px rgba(255, 122, 168, 0.35); }
}
.dots {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 14px;
}
.dots i {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.28);
  border: 1.5px solid rgba(255, 255, 255, 0.45);
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, box-shadow 0.3s;
}
.dots i.on {
  background: #ff6fa3;
  border-color: #fff;
  box-shadow: 0 0 16px #ff6fa3, 0 0 28px #ffb48a;
  transform: scale(1.35) rotate(15deg);
}

/* Tap Ripple & Burst FX */
.fx {
  position: fixed;
  pointer-events: none;
  font-size: clamp(20px, 5vw, 28px);
  z-index: 50;
  animation: rise 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes rise {
  0% { transform: translate(0, 0) scale(0.4) rotate(0deg); opacity: 1; }
  60% { opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy, -140px)) scale(1.45) rotate(var(--rot, 25deg)); opacity: 0; }
}
.tap-ripple {
  position: fixed;
  width: 24px;
  height: 24px;
  margin-left: -12px;
  margin-top: -12px;
  border-radius: 50%;
  border: 2.5px solid rgba(255, 215, 235, 0.85);
  box-shadow: 0 0 18px rgba(255, 92, 147, 0.6);
  pointer-events: none;
  z-index: 45;
  animation: rippleOut 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes rippleOut {
  from { transform: scale(0.4); opacity: 0.95; }
  to { transform: scale(6.5); opacity: 0; }
}

#flash {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle, #ffffff 0%, #ffd4e5 55%, #e4d4fb 100%);
  opacity: 0;
  pointer-events: none;
  z-index: 60;
  transition: opacity 0.85s ease;
}
#flash.on {
  opacity: 1;
}

/* ---------- PAGE 2: AMBIENT PETALS & BOKEH ---------- */
.ambient-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}
.bokeh {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 140, 185, 0.25), rgba(228, 212, 251, 0.05) 70%);
  filter: blur(8px);
  animation: floatBokeh 16s ease-in-out infinite alternate;
}
@keyframes floatBokeh {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(30px, -40px) scale(1.2); }
}
.petal {
  position: absolute;
  top: -30px;
  font-size: 16px;
  opacity: 0.55;
  pointer-events: none;
  animation: fallPetal linear infinite;
}
@keyframes fallPetal {
  0% { transform: translateY(-5vh) translateX(0) rotate(0deg); opacity: 0; }
  12% { opacity: 0.65; }
  88% { opacity: 0.65; }
  100% { transform: translateY(108vh) translateX(var(--sway, 60px)) rotate(360deg); opacity: 0; }
}

/* ---------- PAGE 2: HERO SECTION ---------- */
.hero2 {
  min-height: 100svh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: calc(18vh) 16px 40px;
  z-index: 2;
}

/* Cute Draggable Bouncing Bears */
.bouncing-bear {
  position: fixed;
  top: 0;
  left: 0;
  width: clamp(105px, 14vw, 150px);
  height: auto;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  z-index: 28;
  filter: drop-shadow(0 12px 22px rgba(91, 55, 96, 0.22));
  transition: filter 0.25s ease;
  will-change: transform;
  opacity: 0;
  pointer-events: none;
}
body.open .bouncing-bear {
  opacity: 1;
  pointer-events: auto;
  transition: opacity 0.6s 0.3s ease, filter 0.25s ease;
}
.bouncing-bear:hover {
  filter: drop-shadow(0 16px 28px rgba(255, 92, 147, 0.45));
}
.bouncing-bear.dragging {
  cursor: grabbing;
  filter: drop-shadow(0 22px 36px rgba(255, 92, 147, 0.65));
  z-index: 35;
}
.bear-inner {
  transform-origin: center center;
  transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.bouncing-bear.dragging .bear-inner {
  transform: scale(1.12) rotate(-4deg);
}
.bouncing-bear.squish .bear-inner {
  animation: bearBounceSquish 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes bearBounceSquish {
  0% { transform: scale(1, 1); }
  30% { transform: scale(1.18, 0.84); }
  65% { transform: scale(0.92, 1.08); }
  100% { transform: scale(1, 1); }
}
.bear-brown {
  transform-origin: 108px 150px;
  animation: bearNudgeLeft 4.2s ease-in-out infinite;
}
.bear-white {
  transform-origin: 232px 156px;
  animation: bearNudgeRight 4.2s ease-in-out infinite;
}
@keyframes bearNudgeLeft {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(2.2deg) translateX(2px); }
}
@keyframes bearNudgeRight {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-2.2deg) translateX(-2px); }
}
.bear-hat {
  transform-origin: 108px 62px;
  animation: hatTip 5s ease-in-out infinite;
}
@keyframes hatTip {
  0%, 80%, 100% { transform: rotate(0deg) translateY(0); }
  88% { transform: rotate(-6deg) translateY(-4px); }
  94% { transform: rotate(3deg) translateY(-1px); }
}
.bear-paw {
  transform-origin: 82px 170px;
  animation: pawWave 2.8s ease-in-out infinite;
}
@keyframes pawWave {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-14deg) translateY(-3px); }
}
.bear-eye {
  transform-box: fill-box;
  transform-origin: center;
  animation: blink 4.5s infinite;
}
.laptop-screen {
  animation: screenPulse 2.4s ease-in-out infinite alternate;
}
@keyframes screenPulse {
  0% { fill: #7dd3fc; }
  100% { fill: #bae6fd; }
}
.center-heart {
  transform-box: fill-box;
  transform-origin: center;
  animation: heartBeat 1.8s ease-in-out infinite;
}
.center-heart-2 {
  transform-box: fill-box;
  transform-origin: center;
  animation: sushiHeart 2.8s ease-in-out infinite;
}
@keyframes heartBeat {
  0%, 100% { transform: translate(-2px, -14px) scale(0.9); }
  30% { transform: translate(-2px, -18px) scale(1.18); }
  60% { transform: translate(-2px, -15px) scale(0.98); }
}
@keyframes sushiHeart {
  0% { transform: translate(0, 0) scale(0.4); opacity: 0; }
  40% { opacity: 0.9; }
  100% { transform: translate(8px, -26px) scale(1.1); opacity: 0; }
}

/* Staggered Entrance Animations when Page 2 Opens */
.chap, h1, .sub, .scroll-wrap {
  opacity: 0;
  transform: translateY(28px) scale(0.96);
}
body.open .chap {
  animation: revealUp 0.85s 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
body.open h1 {
  animation: revealUp 0.95s 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
body.open .sub {
  animation: revealUp 0.9s 0.56s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
body.open .scroll-wrap {
  animation: revealUp 0.9s 0.74s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes revealUp {
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.6); }
  to { opacity: 1; transform: scale(1); }
}

.chap {
  font-family: 'Sniglet', cursive;
  font-size: clamp(11px, 2.6vw, 15px);
  letter-spacing: 0.22em;
  color: var(--pink);
  margin-bottom: 8px;
  padding: 5px 16px;
  border-radius: 999px;
  background: rgba(255, 92, 147, 0.1);
  border: 1px solid rgba(255, 92, 147, 0.25);
  box-shadow: 0 4px 14px rgba(255, 92, 147, 0.08);
}

h1 {
  font-family: 'Sniglet', cursive;
  font-weight: 800;
  font-size: clamp(62px, 16.5vw, 148px);
  line-height: 0.98;
  color: var(--plum);
  letter-spacing: -0.02em;
  text-shadow: 0 8px 28px rgba(58, 31, 61, 0.1);
  position: relative;
}
h1 span.word {
  display: inline-block;
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s;
}
h1 span.word:hover {
  transform: translateY(-6px) rotate(-3deg) scale(1.05);
  color: var(--plum-soft);
}
h1 em {
  font-style: normal;
  background: linear-gradient(135deg, #ff4785 0%, #ff85b0 50%, #ff5c93 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  display: inline-block;
  animation: ampDance 3s ease-in-out infinite;
  filter: drop-shadow(0 6px 14px rgba(255, 92, 147, 0.28));
}
@keyframes ampDance {
  0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
  50% { transform: translateY(-12px) rotate(6deg) scale(1.08); }
}

.sub {
  margin-top: 22px;
  font-size: clamp(17px, 4.2vw, 24px);
  line-height: 1.55;
  max-width: 520px;
}
.sub b {
  font-weight: 400;
  color: var(--pink);
  position: relative;
  display: inline-block;
}
.sub b::after {
  content: '';
  position: absolute;
  left: 2%;
  right: 2%;
  bottom: -2px;
  height: 6px;
  background: rgba(255, 92, 147, 0.18);
  border-radius: 99px;
  z-index: -1;
  animation: underlineGrow 3s ease-in-out infinite alternate;
}
@keyframes underlineGrow {
  from { transform: scaleX(0.88); opacity: 0.5; }
  to { transform: scaleX(1.03); opacity: 1; }
}

.scroll-wrap {
  margin-top: 32px;
  cursor: pointer;
  user-select: none;
}
.scroll {
  font-family: 'Sniglet', cursive;
  font-size: 13px;
  letter-spacing: 0.2em;
  color: var(--pink);
  transition: letter-spacing 0.3s ease;
}
.scroll-wrap:hover .scroll {
  letter-spacing: 0.26em;
}
.arrow {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff5c93, #ff85b0);
  color: #fff;
  display: grid;
  place-items: center;
  margin: 10px auto 5px;
  font-size: 20px;
  box-shadow: 0 6px 18px rgba(255, 92, 147, 0.4);
  animation: nudge 1.8s ease-in-out infinite;
  transition: transform 0.3s, box-shadow 0.3s;
}
.scroll-wrap:hover .arrow {
  box-shadow: 0 8px 24px rgba(255, 92, 147, 0.65);
  transform: scale(1.12);
}
@keyframes nudge {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(8px); }
}

/* ---------- POLAROIDS ---------- */
.pol {
  position: absolute;
  width: clamp(190px, 26vw, 315px);
  background: #fff;
  padding: 10px 10px 40px;
  border-radius: 5px;
  box-shadow:
    0 14px 32px rgba(70, 30, 82, 0.2),
    0 2px 6px rgba(70, 30, 82, 0.08);
  z-index: 3;
  cursor: pointer;
  opacity: 0;
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease, z-index 0s;
}
/* Washi tape on top of each Polaroid */
.pol::before {
  content: '';
  position: absolute;
  top: -11px;
  left: 50%;
  width: 68px;
  height: 22px;
  transform: translateX(-50%) rotate(var(--tape-rot, -3deg));
  background: var(--tape-bg, rgba(255, 154, 190, 0.62));
  backdrop-filter: blur(2px);
  border-left: 2px dashed rgba(255, 255, 255, 0.6);
  border-right: 2px dashed rgba(255, 255, 255, 0.6);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
  z-index: 5;
  pointer-events: none;
}
/* Handwritten caption on Polaroid bottom margin */
.pol::after {
  content: attr(data-caption);
  position: absolute;
  bottom: 6px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: 'Caveat', 'Handlee', cursive;
  font-size: clamp(15px, 2vw, 19px);
  color: var(--plum-soft);
  letter-spacing: 0.02em;
  pointer-events: none;
}
.pol .ph {
  position: relative;
  aspect-ratio: 3/4;
  overflow: hidden;
  background: #f3eaf6;
  border-radius: 2px;
}
/* Glossy photo sheen sweep */
.pol .ph::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.38) 48%, transparent 65%);
  transform: translateX(-120%);
  transition: transform 0.75s ease;
  pointer-events: none;
  z-index: 3;
}
.pol:hover .ph::after {
  transform: translateX(120%);
}
.pol img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 30%;
  opacity: 0;
  transform: scale(1.08);
  transition: opacity 1.35s ease, transform 4.2s ease-out;
}
.pol img.show {
  opacity: 1;
  transform: scale(1);
}

/* Polaroid Corner Positions & Floating Animations */
.tl {
  top: 16px;
  left: 2.2%;
  --base-rot: -6.5deg;
  --tape-rot: -4deg;
  --tape-bg: rgba(255, 148, 188, 0.62);
  transform: rotate(var(--base-rot));
}
.tr {
  top: 22px;
  right: 2.2%;
  --base-rot: 5.5deg;
  --tape-rot: 3.5deg;
  --tape-bg: rgba(198, 170, 255, 0.65);
  transform: rotate(var(--base-rot));
}
.bl {
  bottom: 18px;
  left: 2.5%;
  --base-rot: 5deg;
  --tape-rot: 2.5deg;
  --tape-bg: rgba(255, 200, 140, 0.65);
  transform: rotate(var(--base-rot));
}
.br {
  bottom: 14px;
  right: 2.2%;
  --base-rot: -5deg;
  --tape-rot: -3deg;
  --tape-bg: rgba(255, 148, 188, 0.62);
  transform: rotate(var(--base-rot));
}

body.open .pol.tl { animation: polInTL 0.9s 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, floatTL 6.5s 1.2s ease-in-out infinite; }
body.open .pol.tr { animation: polInTR 0.9s 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, floatTR 7.2s 1.4s ease-in-out infinite; }
body.open .pol.bl { animation: polInBL 0.9s 0.58s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, floatBL 6.8s 1.5s ease-in-out infinite; }
body.open .pol.br { animation: polInBR 0.9s 0.74s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, floatBR 7.5s 1.7s ease-in-out infinite; }

@keyframes polInTL {
  from { opacity: 0; transform: translate(-40px, -30px) rotate(-18deg) scale(0.75); }
  to { opacity: 1; transform: translate(0, 0) rotate(-6.5deg) scale(1); }
}
@keyframes polInTR {
  from { opacity: 0; transform: translate(40px, -30px) rotate(18deg) scale(0.75); }
  to { opacity: 1; transform: translate(0, 0) rotate(5.5deg) scale(1); }
}
@keyframes polInBL {
  from { opacity: 0; transform: translate(-40px, 30px) rotate(16deg) scale(0.75); }
  to { opacity: 1; transform: translate(0, 0) rotate(5deg) scale(1); }
}
@keyframes polInBR {
  from { opacity: 0; transform: translate(40px, 30px) rotate(-16deg) scale(0.75); }
  to { opacity: 1; transform: translate(0, 0) rotate(-5deg) scale(1); }
}

@keyframes floatTL {
  0%, 100% { transform: translateY(0) rotate(-6.5deg); }
  50% { transform: translateY(-10px) rotate(-4deg); }
}
@keyframes floatTR {
  0%, 100% { transform: translateY(0) rotate(5.5deg); }
  50% { transform: translateY(-12px) rotate(8deg); }
}
@keyframes floatBL {
  0%, 100% { transform: translateY(0) rotate(5deg); }
  50% { transform: translateY(-9px) rotate(2.5deg); }
}
@keyframes floatBR {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-11px) rotate(-7.5deg); }
}

.pol:hover {
  z-index: 15;
  box-shadow: 0 22px 48px rgba(255, 92, 147, 0.32), 0 6px 16px rgba(58, 31, 61, 0.18);
  filter: brightness(1.03);
}

@media (max-width: 720px) {
  .pol { width: 46.5vw; padding: 7px 7px 32px; }
  .hero2 { padding: min(370px, 58vw + 150px) 14px 305px; }
  .bouncing-bear { width: clamp(92px, 24vw, 122px); }
  .tl { left: 2%; }
  .tr { right: 2%; }
  .bl { left: 2%; }
  .br { right: 2%; }
}

/* ---------- SPARKLES ---------- */
.spark {
  position: absolute;
  color: #b998e8;
  font-size: clamp(16px, 2.5vw, 24px);
  animation: sparkFloat 3.6s ease-in-out infinite;
  pointer-events: none;
  text-shadow: 0 0 12px rgba(255, 92, 147, 0.4);
}
@keyframes sparkFloat {
  0%, 100% { opacity: 0.35; transform: translateY(0) scale(0.85) rotate(0deg); }
  50% { opacity: 1; transform: translateY(-10px) scale(1.35) rotate(25deg); }
}

/* ---------- STORY SECTION ---------- */
.story {
  position: relative;
  z-index: 3;
  padding: 80px 24px 110px;
  text-align: center;
  max-width: 640px;
  margin: 0 auto;
  font-size: clamp(18px, 4.4vw, 23px);
  line-height: 1.75;
}
.story-card {
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 2px solid rgba(255, 255, 255, 0.9);
  border-radius: 28px;
  padding: clamp(32px, 6vw, 52px) clamp(22px, 5vw, 44px);
  box-shadow:
    0 20px 50px rgba(91, 55, 96, 0.1),
    0 4px 14px rgba(255, 92, 147, 0.08);
  position: relative;
  overflow: hidden;
}
.story-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 6px;
  background: linear-gradient(90deg, #ff5c93, #ffb48a, #c897ff, #ff5c93);
  background-size: 200% 100%;
  animation: rainbowSlide 6s linear infinite;
}
@keyframes rainbowSlide {
  to { background-position: 200% 0; }
}

.story-doodles {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-bottom: 16px;
  font-size: 24px;
}
.story-doodles span {
  display: inline-block;
  animation: doodleBounce 2.6s ease-in-out infinite;
}
.story-doodles span:nth-child(2) { animation-delay: 0.3s; }
.story-doodles span:nth-child(3) { animation-delay: 0.6s; }
.story-doodles span:nth-child(4) { animation-delay: 0.9s; }
@keyframes doodleBounce {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-7px) rotate(8deg); }
}

.story h2 {
  font-family: 'Sniglet', cursive;
  color: var(--plum);
  font-size: clamp(30px, 7.2vw, 44px);
  margin-bottom: 18px;
}
.story p {
  opacity: 0;
  transform: translateY(22px);
  transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  padding: 14px 18px;
  border-radius: 16px;
  background: rgba(255, 245, 250, 0.65);
  border: 1px solid rgba(255, 92, 147, 0.14);
}
.story p.in-view {
  opacity: 1;
  transform: translateY(0);
}
.story p + p {
  margin-top: 16px;
}
.story p:hover {
  transform: translateY(-3px) scale(1.01);
  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 8px 24px rgba(255, 92, 147, 0.12);
}

/* Interactive Love Button in Story */
.love-action {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.heart-btn {
  appearance: none;
  border: none;
  background: linear-gradient(135deg, #ff5c93 0%, #ff85b0 100%);
  color: #fff;
  font-family: 'Sniglet', cursive;
  font-size: clamp(16px, 3.8vw, 19px);
  padding: 12px 28px;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(255, 92, 147, 0.38);
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
  animation: pulseBtn 2.5s infinite;
}
.heart-btn:hover {
  transform: translateY(-3px) scale(1.06);
  box-shadow: 0 12px 30px rgba(255, 92, 147, 0.55);
}
.heart-btn:active {
  transform: scale(0.93);
}
@keyframes pulseBtn {
  0%, 100% { box-shadow: 0 8px 24px rgba(255, 92, 147, 0.38), 0 0 0 0 rgba(255, 92, 147, 0.4); }
  50% { box-shadow: 0 8px 24px rgba(255, 92, 147, 0.38), 0 0 0 12px rgba(255, 92, 147, 0); }
}
.love-counter {
  font-size: 14px;
  color: var(--plum-soft);
  opacity: 0.85;
}

/* ---------- POLAROID LIGHTBOX MODAL ---------- */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(34, 16, 44, 0.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 80;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.35s ease, visibility 0.35s;
}
.lightbox.active {
  opacity: 1;
  visibility: visible;
}
.lightbox-card {
  background: #fff;
  padding: 14px 14px 22px;
  border-radius: 10px;
  width: min(88vw, 370px);
  box-shadow: 0 28px 65px rgba(0, 0, 0, 0.45);
  transform: scale(0.82) rotate(-4deg);
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-align: center;
  position: relative;
}
.lightbox.active .lightbox-card {
  transform: scale(1) rotate(0deg);
}
.lightbox-img-wrap {
  aspect-ratio: 3/4;
  width: 100%;
  overflow: hidden;
  border-radius: 4px;
  background: #f3eaf6;
  position: relative;
}
.lightbox-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 30%;
  display: block;
}
.lightbox-caption {
  font-family: 'Caveat', 'Handlee', cursive;
  font-size: 24px;
  color: var(--plum);
  margin-top: 12px;
}
.lightbox-nav {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
}
.lb-btn {
  appearance: none;
  border: 1.5px solid rgba(255, 92, 147, 0.35);
  background: #fff5f8;
  color: var(--plum);
  font-family: 'Sniglet', cursive;
  font-size: 13px;
  padding: 6px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
}
.lb-btn:hover {
  background: var(--pink);
  color: #fff;
  transform: scale(1.05);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

      <button type="button" class="lb-btn" id="lbPrev">← prev</button>
      <button type="button" class="lb-btn" id="lbLove">💗 love</button>
      <button type="button" class="lb-btn" id="lbNext">next →</button>
      <button type="button" class="lb-btn" id="lbClose">close ✕</button>
    </div>
  </div>
</div>

<div id="flash"></div>

<script>
// ---------- SYNTHESIZED MUSIC BOX CHIMES ----------
var soundEnabled = true;
var audioCtx = null;
var soundBtn = document.getElementById('soundToggle');

function getAudio() {
  if (!soundEnabled) return null;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  if (!audioCtx) audioCtx = new Ctx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playNote(freq, delay, duration) {
  var ctx = getAudio();
  if (!ctx) return;
  try {
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
    gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.11, ctx.currentTime + delay + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + (duration || 0.45));
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + (duration || 0.45) + 0.05);
  } catch (e) {}
}

function playTapChime(step) {
  var scale = [523.25, 587.33, 659.25, 783.99, 1046.5];
  var f = scale[(step - 1) % scale.length];
  playNote(f, 0, 0.4);
  playNote(f * 1.5, 0.06, 0.35);
}

function playMagicalChord() {
  var notes = [523.25, 659.25, 783.99, 987.77, 1046.5, 1318.5];
  for (var i = 0; i < notes.length; i++) {
    playNote(notes[i], i * 0.08, 0.85);
  }
}

soundBtn.addEventListener('click', function(ev) {
  ev.stopPropagation();
  soundEnabled = !soundEnabled;
  soundBtn.textContent = soundEnabled ? '🔔 sound on' : '🔕 muted';
  if (soundEnabled) playNote(659.25, 0, 0.3);
});

// ---------- PAGE 1: STARS & AMBIENCE ----------
var p1 = document.getElementById('p1');
for (var i = 0; i < 55; i++) {
  var s = document.createElement('span');
  s.className = 'star' + (i % 9 === 0 ? ' cross' : '');
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 62 + '%';
  var sz = (Math.random() * 2.5 + 1.8).toFixed(1) + 'px';
  s.style.width = sz;
  s.style.height = sz;
  s.style.animationDelay = (-Math.random() * 4).toFixed(2) + 's';
  s.style.animationDuration = (2.6 + Math.random() * 3).toFixed(2) + 's';
  p1.appendChild(s);
}

// ---------- PAGE 2: FLOATING PETALS & BOKEH ----------
var ambient = document.getElementById('ambientLayer');
for (var b = 0; b < 8; b++) {
  var orb = document.createElement('div');
  orb.className = 'bokeh';
  var bSize = 90 + Math.random() * 140;
  orb.style.width = bSize + 'px';
  orb.style.height = bSize + 'px';
  orb.style.left = Math.random() * 92 + '%';
  orb.style.top = Math.random() * 90 + '%';
  orb.style.animationDelay = (-Math.random() * 10).toFixed(1) + 's';
  ambient.appendChild(orb);
}
var petalChars = ['🌸', '💗', '✨', '🤍', '🌷'];
for (var p = 0; p < 16; p++) {
  var pt = document.createElement('span');
  pt.className = 'petal';
  pt.textContent = petalChars[p % petalChars.length];
  pt.style.left = Math.random() * 100 + '%';
  pt.style.fontSize = (12 + Math.random() * 10).toFixed(0) + 'px';
  pt.style.setProperty('--sway', (Math.random() * 120 - 60).toFixed(0) + 'px');
  pt.style.animationDuration = (9 + Math.random() * 9).toFixed(1) + 's';
  pt.style.animationDelay = (-Math.random() * 15).toFixed(1) + 's';
  ambient.appendChild(pt);
}

// ---------- PARTICLE BURST & RIPPLE ----------
var NEED = 5, n = 0;
var hero = document.getElementById('hero');
var dots = document.getElementById('dots');
var hint = document.getElementById('hintTxt');
for (var d = 0; d < NEED; d++) dots.appendChild(document.createElement('i'));

var msgs = ['again… ✨', 'a little more 💗', 'almost there 🌴', 'one last tap 🍣'];

function spawnRipple(x, y) {
  var ring = document.createElement('span');
  ring.className = 'tap-ripple';
  ring.style.left = x + 'px';
  ring.style.top = y + 'px';
  document.body.appendChild(ring);
  setTimeout(function() { ring.remove(); }, 900);
}

function burst(x, y, count) {
  var e = ['💗', '✨', '🍣', '🌴', '💖', '🌟', '🤍'];
  var total = count || 8;
  spawnRipple(x, y);
  for (var k = 0; k < total; k++) {
    var f = document.createElement('span');
    f.className = 'fx';
    f.textContent = e[Math.floor(Math.random() * e.length)];
    f.style.left = (x - 12 + Math.random() * 34 - 17) + 'px';
    f.style.top = (y - 12 + Math.random() * 16 - 8) + 'px';
    f.style.setProperty('--dx', (Math.random() * 160 - 80).toFixed(0) + 'px');
    f.style.setProperty('--dy', (-90 - Math.random() * 110).toFixed(0) + 'px');
    f.style.setProperty('--rot', (Math.random() * 90 - 45).toFixed(0) + 'deg');
    document.body.appendChild(f);
    setTimeout(function(el) { el.remove(); }.bind(null, f), 1400);
  }
}

function tap(ev) {
  if (n >= NEED) return;
  n++;
  var t = ev.touches ? ev.touches[0] : ev;
  var r = hero.getBoundingClientRect();
  var cx = (t && t.clientX) ? t.clientX : (r.left + r.width / 2);
  var cy = (t && t.clientY) ? t.clientY : (r.top + r.height / 2);
  burst(cx, cy, 7 + n * 2);
  playTapChime(n);

  hero.classList.add('pop');
  hint.classList.add('bump');
  setTimeout(function() {
    hero.classList.remove('pop');
    hint.classList.remove('bump');
  }, 260);

  hero.style.setProperty('--g', n);
  dots.children[n - 1].classList.add('on');

  if (n < NEED) {
    hint.textContent = msgs[Math.min(n - 1, msgs.length - 1)];
  } else {
    hint.textContent = 'here we go… 💗';
    playMagicalChord();
    var fl = document.getElementById('flash');
    fl.classList.add('on');
    setTimeout(function() {
      document.body.classList.add('open');
      startCycle();
      revealStoryOnScroll();
      setTimeout(function() { fl.classList.remove('on'); }, 550);
    }, 850);
  }
}

hero.addEventListener('click', tap);
hero.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    tap(e);
  }
});

// Moon wish Easter egg on Page 1
document.getElementById('moonBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  burst(e.clientX || window.innerWidth * 0.8, e.clientY || window.innerHeight * 0.15, 6);
  playNote(880, 0, 0.5);
});

// Replay Intro button
document.getElementById('replayBtn').addEventListener('click', function() {
  var fl = document.getElementById('flash');
  fl.classList.add('on');
  setTimeout(function() {
    n = 0;
    hero.style.setProperty('--g', 0);
    hint.textContent = 'tap the palm & sushi ✨';
    for (var i = 0; i < dots.children.length; i++) {
      dots.children[i].classList.remove('on');
    }
    document.body.classList.remove('open');
    document.getElementById('p2').scrollTop = 0;
    setTimeout(function() { fl.classList.remove('on'); }, 450);
  }, 400);
});

// ---------- PHOTO CYCLE & LIGHTBOX ----------
var started = false;
function startCycle() {
  if (started) return;
  started = true;
  document.querySelectorAll('.pol').forEach(function(p, idx) {
    var im = p.querySelectorAll('img'), cur = 0;
    setTimeout(function() {
      setInterval(function() {
        im[cur].classList.remove('show');
        cur = 1 - cur;
        im[cur].classList.add('show');
      }, 4000);
    }, idx * 700);
  });
}

// Collect all 8 photos for Lightbox browsing
var allPhotos = [];
document.querySelectorAll('.pol').forEach(function(pol) {
  var cap = pol.getAttribute('data-caption') || 'you & me 💗';
  var imgs = pol.querySelectorAll('img');
  imgs.forEach(function(img, i) {
    allPhotos.push({ src: img.src, caption: cap + ' (' + (i + 1) + '/2)' });
  });
  pol.addEventListener('click', function(ev) {
    var activeImg = pol.querySelector('img.show') || imgs[0];
    var foundIdx = 0;
    for (var k = 0; k < allPhotos.length; k++) {
      if (allPhotos[k].src === activeImg.src) { foundIdx = k; break; }
    }
    openLightbox(foundIdx);
    burst(ev.clientX || window.innerWidth / 2, ev.clientY || window.innerHeight / 2, 5);
    playNote(659.25, 0, 0.35);
  });
});

var lb = document.getElementById('lightbox');
var lbImg = document.getElementById('lightboxImg');
var lbCap = document.getElementById('lightboxCap');
var currentLbIdx = 0;

function openLightbox(idx) {
  currentLbIdx = (idx + allPhotos.length) % allPhotos.length;
  lbImg.src = allPhotos[currentLbIdx].src;
  lbCap.textContent = allPhotos[currentLbIdx].caption;
  lb.classList.add('active');
}

document.getElementById('lbPrev').addEventListener('click', function(e) {
  e.stopPropagation();
  openLightbox(currentLbIdx - 1);
  playNote(523.25, 0, 0.25);
});
document.getElementById('lbNext').addEventListener('click', function(e) {
  e.stopPropagation();
  openLightbox(currentLbIdx + 1);
  playNote(659.25, 0, 0.25);
});
document.getElementById('lbLove').addEventListener('click', function(e) {
  e.stopPropagation();
  var r = e.currentTarget.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top, 10);
  playMagicalChord();
});
document.getElementById('lbClose').addEventListener('click', function(e) {
  e.stopPropagation();
  lb.classList.remove('active');
});
lb.addEventListener('click', function(e) {
  if (e.target === lb) lb.classList.remove('active');
});

// ---------- DRAGGABLE & BOUNCING BEARS PHYSICS ----------
var bearBrownEl = document.getElementById('bearsSvg');
var bearWhiteEl = document.getElementById('bearWhiteSvg');

var bearsState = [
  {
    el: bearBrownEl,
    x: Math.max(20, window.innerWidth * 0.34),
    y: Math.max(50, window.innerHeight * 0.08),
    vx: 2.1,
    vy: 1.65,
    rot: 0,
    vRot: 0.35,
    dragging: false,
    dragOffsetX: 0,
    dragOffsetY: 0,
    lastPx: 0,
    lastPy: 0
  },
  {
    el: bearWhiteEl,
    x: Math.min(window.innerWidth - 150, window.innerWidth * 0.54),
    y: Math.max(50, window.innerHeight * 0.08),
    vx: -1.95,
    vy: 1.8,
    rot: 0,
    vRot: -0.35,
    dragging: false,
    dragOffsetX: 0,
    dragOffsetY: 0,
    lastPx: 0,
    lastPy: 0
  }
];

function triggerSquish(b) {
  b.el.classList.remove('squish');
  void b.el.offsetWidth;
  b.el.classList.add('squish');
}

var lastHugTime = 0;

function setupBearDrag(b) {
  function onDown(ev) {
    ev.preventDefault();
    ev.stopPropagation();
    var pt = ev.touches ? ev.touches[0] : ev;
    b.dragging = true;
    b.el.classList.add('dragging');
    b.dragOffsetX = pt.clientX - b.x;
    b.dragOffsetY = pt.clientY - b.y;
    b.lastPx = pt.clientX;
    b.lastPy = pt.clientY;
    b.vx = 0;
    b.vy = 0;
    playNote(659.25, 0, 0.2);
  }

  function onMove(ev) {
    if (!b.dragging) return;
    var pt = ev.touches ? ev.touches[0] : ev;
    var nx = pt.clientX - b.dragOffsetX;
    var ny = pt.clientY - b.dragOffsetY;
    b.vx = (pt.clientX - b.lastPx) * 0.45;
    b.vy = (pt.clientY - b.lastPy) * 0.45;
    b.lastPx = pt.clientX;
    b.lastPy = pt.clientY;
    b.x = nx;
    b.y = ny;
  }

  function onUp(ev) {
    if (!b.dragging) return;
    b.dragging = false;
    b.el.classList.remove('dragging');
    // Ensure a lively minimum bounce velocity if released gently
    var speed = Math.hypot(b.vx, b.vy);
    if (speed < 1.5) {
      var angle = Math.random() * Math.PI * 2;
      b.vx = Math.cos(angle) * 2.4;
      b.vy = Math.sin(angle) * 2.4;
      var rect = b.el.getBoundingClientRect();
      burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 7);
    } else if (speed > 14) {
      b.vx = (b.vx / speed) * 14;
      b.vy = (b.vy / speed) * 14;
    }
    b.vRot = b.vx * 0.25;
    triggerSquish(b);
    playNote(783.99, 0, 0.28);
  }

  b.el.addEventListener('mousedown', onDown);
  b.el.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('mousemove', onMove, { passive: true });
  window.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
}

bearsState.forEach(setupBearDrag);

function animateBears() {
  var vw = window.innerWidth;
  var vh = window.innerHeight;

  for (var i = 0; i < bearsState.length; i++) {
    var b = bearsState[i];
    var bw = b.el.offsetWidth || 125;
    var bh = b.el.offsetHeight || 125;

    if (!b.dragging) {
      b.x += b.vx;
      b.y += b.vy;

      // Gently damp extreme throw speeds back to a playful cruise
      var sp = Math.hypot(b.vx, b.vy);
      if (sp > 3.2) {
        b.vx *= 0.985;
        b.vy *= 0.985;
      } else if (sp < 1.6 && sp > 0.01) {
        b.vx *= 1.02;
        b.vy *= 1.02;
      }

      b.rot += b.vRot;
      if (b.rot > 12 || b.rot < -12) b.vRot = -b.vRot;

      var hitWall = false;
      if (b.x <= 6) {
        b.x = 6;
        b.vx = Math.abs(b.vx);
        hitWall = true;
      } else if (b.x + bw >= vw - 6) {
        b.x = Math.max(6, vw - bw - 6);
        b.vx = -Math.abs(b.vx);
        hitWall = true;
      }

      if (b.y <= 6) {
        b.y = 6;
        b.vy = Math.abs(b.vy);
        hitWall = true;
      } else if (b.y + bh >= vh - 6) {
        b.y = Math.max(6, vh - bh - 6);
        b.vy = -Math.abs(b.vy);
        hitWall = true;
      }

      if (hitWall && document.body.classList.contains('open')) {
        b.vRot = (Math.random() - 0.5) * 1.2;
        triggerSquish(b);
      }
    }
  }

  // Bear-to-bear collision & cute heart burst when they bump!
  var b1 = bearsState[0];
  var b2 = bearsState[1];
  var r1 = (b1.el.offsetWidth || 120) * 0.38;
  var r2 = (b2.el.offsetWidth || 120) * 0.38;
  var c1x = b1.x + r1;
  var c1y = b1.y + r1;
  var c2x = b2.x + r2;
  var c2y = b2.y + r2;
  var dx = c2x - c1x;
  var dy = c2y - c1y;
  var dist = Math.hypot(dx, dy);
  var minDist = r1 + r2;

  if (dist > 0 && dist < minDist) {
    var nx = dx / dist;
    var ny = dy / dist;
    var overlap = (minDist - dist) * 0.5;
    if (!b1.dragging) { b1.x -= nx * overlap; b1.y -= ny * overlap; }
    if (!b2.dragging) { b2.x += nx * overlap; b2.y += ny * overlap; }

    var kx = b1.vx - b2.vx;
    var ky = b1.vy - b2.vy;
    var p = 2 * (nx * kx + ny * ky) / 2;
    if (!b1.dragging) {
      b1.vx -= p * nx;
      b1.vy -= p * ny;
      triggerSquish(b1);
    }
    if (!b2.dragging) {
      b2.vx += p * nx;
      b2.vy += p * ny;
      triggerSquish(b2);
    }

    var now = Date.now();
    if (document.body.classList.contains('open') && now - lastHugTime > 900) {
      lastHugTime = now;
      burst((c1x + c2x) / 2, (c1y + c2y) / 2, 9);
      playNote(880, 0, 0.3);
      playNote(1046.5, 0.07, 0.35);
    }
  }

  for (var j = 0; j < bearsState.length; j++) {
    var bj = bearsState[j];
    bj.el.style.transform = 'translate3d(' + bj.x.toFixed(1) + 'px,' + bj.y.toFixed(1) + 'px,0) rotate(' + bj.rot.toFixed(1) + 'deg)';
  }

  requestAnimationFrame(animateBears);
}
requestAnimationFrame(animateBears);

document.getElementById('scrollBtn').addEventListener('click', function() {
  document.getElementById('storySection').scrollIntoView({ behavior: 'smooth' });
  playNote(587.33, 0, 0.3);
});

// Story Scroll Reveal
function revealStoryOnScroll() {
  var paras = document.querySelectorAll('.story p');
  var p2 = document.getElementById('p2');
  function check() {
    var trigger = window.innerHeight * 0.88;
    paras.forEach(function(el, i) {
      var rect = el.getBoundingClientRect();
      if (rect.top < trigger) {
        setTimeout(function() { el.classList.add('in-view'); }, i * 160);
      }
    });
  }
  p2.addEventListener('scroll', check, { passive: true });
  setTimeout(check, 350);
}


</script>
